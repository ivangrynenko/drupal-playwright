# Modern Docker Compose doesn't require version specification

services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.52.0
    container_name: playwright
    volumes:
      - ./tests/playwright:/app/tests/playwright
      - ./.logs:/app/.logs
    environment:
      # Target URL for remote testing
      PLAYWRIGHT_BASE_URL: ${PLAYWRIGHT_BASE_URL:-https://example.com}
      # Headless mode
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
      # Browser configuration - customize for your security requirements
      # Default includes container-safe flags, override via environment variable for security
      PLAYWRIGHT_CHROMIUM_ARGS: ${PLAYWRIGHT_CHROMIUM_ARGS:---no-sandbox --disable-setuid-sandbox}
      # Test environment
      CI: ${CI:-false}
      NODE_ENV: ${NODE_ENV:-test}
      # Timezone
      TZ: ${TZ:-UTC}
    working_dir: /app/tests/playwright
    # Keep container running for exec commands
    command: sleep infinity
    networks:
      - playwright-net

networks:
  playwright-net:
    driver: bridge
